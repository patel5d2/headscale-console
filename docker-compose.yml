services:
  headscale-console:
    build: .
    image: headscale-console:latest
    container_name: headscale-console
    restart: unless-stopped
    ports:
      # Open http://<host>:8090 — change the left side if 8090 is taken.
      - "8090:8080"
    environment:
      # Recommended: lock the console to your Headscale server by putting
      #   HEADSCALE_URL=https://hs.example.com
      # in a .env file next to this one (see .env.example). The login page then
      # only asks for the API key, and Browser SSH, the audit log and policy
      # history are turned on. Left empty, the login page asks for the URL.
      HEADSCALE_URL: "${HEADSCALE_URL:-}"

      # If HEADSCALE_URL is not set, optionally restrict which hosts can be entered.
      # ALLOWED_HEADSCALE_HOSTS: "headscale.example.com,192.168.0.50"

      # Accept a self-signed certificate on the Headscale server.
      # HEADSCALE_INSECURE_TLS: "true"
      DATA_DIR: /data
      TZ: "${TZ:-UTC}"
    volumes:
      - console-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    # If Headscale runs in Docker on the same host, join its network and use
    # HEADSCALE_URL: "http://headscale:8080" instead of the public URL.
    # networks: [headscale]

# networks:
#   headscale:
#     external: true

volumes:
  console-data:
