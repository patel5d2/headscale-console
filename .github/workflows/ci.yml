name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: ShellCheck
        run: shellcheck deploy/*.sh scripts/*.sh
      - run: npx playwright install --with-deps chromium
      # Builds, runs the API, end-to-end, unit and CLI tests, and enforces the coverage thresholds.
      - run: npm test
      - name: Upload coverage and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            coverage/
            playwright-report/
          retention-days: 14
