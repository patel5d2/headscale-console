name: Container image

# Publishes ghcr.io/<owner>/headscale-console for linux/amd64 and linux/arm64:
#   main      -> :latest, :main and :sha-<short>
#   v1.2.3    -> :1.2.3, :1.2 and :latest
# Pull requests build the image without pushing it.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR shows the description on the package page, under its own "docker pull"
      # line, so it carries the command that actually starts the console.
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          labels: |
            org.opencontainers.image.description=Web admin console for Headscale. Run: docker run -d --name headscale-console --restart unless-stopped -p 8090:8080 -v headscale-console-data:/data ghcr.io/patel5d2/headscale-console:latest then open http://localhost:8090
          annotations: |
            org.opencontainers.image.description=Web admin console for Headscale. Run: docker run -d --name headscale-console --restart unless-stopped -p 8090:8080 -v headscale-console-data:/data ghcr.io/patel5d2/headscale-console:latest then open http://localhost:8090
          images: ghcr.io/${{ github.repository_owner }}/headscale-console
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # The default target includes Browser SSH, built from the pinned Headplane source.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name smoke -p 8080:8080 -e HEADSCALE_URL=https://headscale.invalid "ghcr.io/${{ github.repository_owner }}/headscale-console:sha-${GITHUB_SHA::7}"
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/console-config.json | grep -q '"browserSsh":true'
