# Runs the published image; nothing to build.
#   cp .env.example .env    # optional: set HEADSCALE_URL to lock the console to your server
#   docker compose -f docker-compose.ghcr.yml up -d
# Then open http://localhost:8090
services:
  headscale-console:
    image: ghcr.io/patel5d2/headscale-console:${HEADSCALE_CONSOLE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      HEADSCALE_URL: "${HEADSCALE_URL:-}"
      DATA_DIR: /data
      TZ: "${TZ:-UTC}"
    volumes:
      - console-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  console-data:
