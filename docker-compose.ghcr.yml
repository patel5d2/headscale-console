# After the image has been published:
# HEADSCALE_URL=https://headscale.example.com docker compose -f docker-compose.ghcr.yml up -d
services:
  headscale-console:
    image: ghcr.io/patel5d2/headscale-console:${HEADSCALE_CONSOLE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      HEADSCALE_URL: "${HEADSCALE_URL:?Set HEADSCALE_URL to your Headscale server URL}"
      DATA_DIR: /data
      TZ: "${TZ:-UTC}"
    volumes:
      - console-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  console-data:
